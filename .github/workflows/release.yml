name: Publicar APK

# Actions → "Publicar APK" → Run workflow, con la versión (por ejemplo 1.0.1).
# Compila los APK firmados (arm64 y arm32) y crea la versión vX.Y.Z con ellos adjuntos.
# Las versiones del repo son inmutables: los APK tienen que ir en el mismo paso que la publicación.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión, sin la v (por ejemplo 1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Comprobar la versión
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La versión debe tener la forma 1.2.3"
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Recuperar la clave de firma
        env:
          FITLOG_KEYSTORE_BASE64: ${{ secrets.FITLOG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FITLOG_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret FITLOG_KEYSTORE_BASE64 (ver README)."
            exit 1
          fi
          echo "$FITLOG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fitlog.jks"

      - name: Compilar
        env:
          FITLOG_STORE_FILE: ${{ runner.temp }}/fitlog.jks
          FITLOG_STORE_PASSWORD: ${{ secrets.FITLOG_STORE_PASSWORD }}
          FITLOG_KEY_ALIAS: ${{ secrets.FITLOG_KEY_ALIAS }}
          FITLOG_KEY_PASSWORD: ${{ secrets.FITLOG_KEY_PASSWORD }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleRelease \
            -Pfitlog.versionName="$VERSION" -Pfitlog.versionCode="${{ github.run_number }}"

      - name: Publicar la versión con los APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "FitLog-$VERSION-arm64.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "FitLog-$VERSION-arm32.apk"
          gh release create "v$VERSION" "FitLog-$VERSION-arm64.apk" "FitLog-$VERSION-arm32.apk" \
            --target "$GITHUB_SHA" --title "FitLog $VERSION" --notes-file .github/release-notes.md
