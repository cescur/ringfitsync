name: Publicar APK

# Al publicar una versión en GitHub (Releases → Draft a new release, etiqueta vX.Y.Z),
# compila los APK firmados (arm64 y arm32) y los adjunta a esa versión.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Recuperar la clave de firma
        env:
          FITLOG_KEYSTORE_BASE64: ${{ secrets.FITLOG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FITLOG_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret FITLOG_KEYSTORE_BASE64 (ver README)."
            exit 1
          fi
          echo "$FITLOG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fitlog.jks"

      - name: Compilar
        env:
          FITLOG_STORE_FILE: ${{ runner.temp }}/fitlog.jks
          FITLOG_STORE_PASSWORD: ${{ secrets.FITLOG_STORE_PASSWORD }}
          FITLOG_KEY_ALIAS: ${{ secrets.FITLOG_KEY_ALIAS }}
          FITLOG_KEY_PASSWORD: ${{ secrets.FITLOG_KEY_PASSWORD }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleRelease \
            -Pfitlog.versionName="${TAG#v}" -Pfitlog.versionCode="${{ github.run_number }}"

      - name: Adjuntar el APK a la versión
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "FitLog-$TAG-arm64.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "FitLog-$TAG-arm32.apk"
          gh release upload "$TAG" "FitLog-$TAG-arm64.apk" "FitLog-$TAG-arm32.apk" --clobber
